services:
  postgres:
    image: postgres:16-alpine
    container_name: pam-postgres
    environment:
      POSTGRES_DB: ${KC_DB_NAME:?Set KC_DB_NAME in .env}
      POSTGRES_USER: ${KC_DB_USER:?Set KC_DB_USER in .env}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in .env}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - pam-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER:?} -d ${KC_DB_NAME:?}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: pam-keycloak
    command: start-dev
    environment:
      # Admin bootstrap
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?Set KC_ADMIN_USER in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set KC_ADMIN_PASSWORD in .env}

      # === THIS IS WHAT MAKES DATA PERSIST ===
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME:?Set KC_DB_NAME in .env}
      KC_DB_USERNAME: ${KC_DB_USER:?Set KC_DB_USER in .env}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in .env}
      # ======================================

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pam-net

volumes:
  keycloak_db_data:

networks:
  pam-net:
    driver: bridge
