services:
  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    network_mode: host
    cap_add:
      - IPC_LOCK
    restart: unless-stopped
    command: server
    environment:
      VAULT_LOCAL_CONFIG: |
        storage "file" { path = "/vault/data" }
        listener "tcp" { address = "0.0.0.0:8210" tls_disable = true }
        disable_mlock = true
        api_addr = "http://0.0.0.0:8210"
        ui = true
    volumes:
      - vault_data:/vault/data

  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: guac-postgres
    environment:
      POSTGRES_DB: ${GUAC_DB_NAME:?Set GUAC_DB_NAME in .env}
      POSTGRES_USER: ${GUAC_DB_USER:?Set GUAC_DB_USER in .env}
      POSTGRES_PASSWORD: ${GUAC_DB_PASSWORD:?Set GUAC_DB_PASSWORD in .env}
    volumes:
      - ./guac/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    ports:
      - "8081:8080"
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: ${GUAC_DB_NAME:?Set GUAC_DB_NAME in .env}
      POSTGRESQL_USER: ${GUAC_DB_USER:?Set GUAC_DB_USER in .env}
      POSTGRESQL_PASSWORD: ${GUAC_DB_PASSWORD:?Set GUAC_DB_PASSWORD in .env}
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${GUAC_JSON_SECRET:?Set GUAC_JSON_SECRET in .env}
    depends_on:
      - guacd
      - postgres
    restart: unless-stopped

volumes:
  vault_data:
