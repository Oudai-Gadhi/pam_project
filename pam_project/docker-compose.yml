# PUBLIC_HOST must match the IP you type in the Windows browser (see .env)
services:
  pam-db:
    image: postgres:16-alpine
    container_name: pam-app-db
    environment:
      POSTGRES_DB: ${PAM_DB_NAME:-pam}
      POSTGRES_USER: ${PAM_DB_USER:-pam}
      POSTGRES_PASSWORD: ${PAM_DB_PASSWORD:?Set PAM_DB_PASSWORD in .env}
    volumes:
      - pam_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAM_DB_USER:-pam} -d ${PAM_DB_NAME:-pam}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pam-backend
    # The app services use the Compose network. Only this service needs a route
    # back to the VM host, where Keycloak is already listening on port 8080.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KEYCLOAK_URL: http://host.docker.internal:8080
      KEYCLOAK_PUBLIC_URL: http://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-pam}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-pam-app}
      FRONTEND_URL: http://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}:3000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PAM_DB_HOST: pam-db
      PAM_DB_PORT: 5432
      PAM_DB_NAME: ${PAM_DB_NAME:-pam}
      PAM_DB_USER: ${PAM_DB_USER:-pam}
      PAM_DB_PASSWORD: ${PAM_DB_PASSWORD:?Set PAM_DB_PASSWORD in .env}
      VAULT_ADDR: ${VAULT_ADDR:?Set VAULT_ADDR in .env}
      VAULT_TOKEN: ${VAULT_TOKEN:?Set VAULT_TOKEN in .env}
      VAULT_SSH_MOUNT: ${VAULT_SSH_MOUNT:-ssh-client-signer}
      VAULT_SSH_ROLE: ${VAULT_SSH_ROLE:-dev-role}
      VAULT_VERIFY_TLS: ${VAULT_VERIFY_TLS:-false}
      GUACAMOLE_PUBLIC_URL: ${GUACAMOLE_PUBLIC_URL:?Set GUACAMOLE_PUBLIC_URL in .env}
      GUACAMOLE_JSON_SECRET: ${GUACAMOLE_JSON_SECRET:?Set GUACAMOLE_JSON_SECRET in .env}
      PAM_TARGETS_JSON: ${PAM_TARGETS_JSON:?Set PAM_TARGETS_JSON in .env}
    depends_on:
      pam-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: http://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}:8080
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-pam}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-pam-app}
        VITE_API_BASE_URL: http://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}:3000
    container_name: pam-frontend
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
      KEYCLOAK_PUBLIC_URL: http://${PUBLIC_HOST}:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-pam}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-pam-app}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pam_db_data:
