[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Blocker rules — pipeline fails on these
# F = pyflakes (real bugs: undefined names, unused imports)
# E9 = syntax / runtime errors only
select = ["F", "E9"]

# Warning rules — logged, don't block
extend-select = [
    "E",    # pycodestyle
    "I",    # import sorting
    "W",    # warnings
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]

# Don't complain about line length — ruff format handles that
ignore = ["E501"]
