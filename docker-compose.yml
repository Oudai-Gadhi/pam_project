# PUBLIC_HOST must match the IP you type in the Windows browser (see .env)
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pam-backend
    # Host network: backend reaches Keycloak on the VM via localhost:8080
    network_mode: host
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      KEYCLOAK_PUBLIC_URL: http://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-pam}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-pam-app}
      FRONTEND_URL: http://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}:3000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: http://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}:8080
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-pam}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-pam-app}
        VITE_API_BASE_URL: http://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}:8000
    container_name: pam-frontend
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
      KEYCLOAK_PUBLIC_URL: http://${PUBLIC_HOST}:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-pam}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-pam-app}
      API_BASE_URL: http://${PUBLIC_HOST}:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
